spec_version: "0.2"

service:
  name: Voix Fluide
  repo: C2-POLY/voix-fluide
  description: Application de dictée pour macOS. La personne maintient ou touche une touche, parle, et le texte est transcrit sur le Mac puis collé dans l'app active. Une seconde touche envoie une question orale à Claude Code, en lecture seule, dans l'un des dépôts de la personne. Le dépôt contient aussi le site de présentation de l'app.
  controller: user-of-the-app # declared: question 1, developer and product owner
  controller_rationale: "Voix Fluide tourne sur le Mac de la personne : la voix, le texte dicté et les questions à Claude Code restent sur le Mac ou partent avec le propre compte Claude Code de la personne, et C2-POLY n'en reçoit aucune. C2-POLY ne contrôle que son site de présentation et la distribution des mises à jour." # to confirm by the DPO
  privacy_by_design: # found in code, to confirm
    - La parole est transcrite sur le Mac, sans serveur de C2-POLY
    - Seul le dernier enregistrement est gardé, et il est remplacé par le suivant
    - Le texte précédent du presse-papiers est remis après le collage
    - Claude Code tourne avec des outils en lecture seule
    - La vérification des mises à jour n'envoie aucun identifiant
  components:
    - {id: app, kind: macos-app, controller: user-of-the-app}
    - {id: updates, kind: release-channel, controller: organisation} # the GitHub Releases the app checks and downloads from
    - {id: site, kind: website, controller: organisation}
  source: {kind: declared, ref: "CLAUDE.md, Cargo.toml; controller answered by the developer and product owner during compliance-init"}

personal_data:
  - id: voice-recording
    component: app
    subjects: ["utilisateurs de l'app", "personnes dont l'utilisateur parle"]
    fields:
      - {name: "enregistrement micro d'une dictée (audio)", category: unknown}
    purpose: transcrire la dictée sur le Mac ; le dernier enregistrement est gardé pour que la personne puisse le réécouter et vérifier le micro
    legal_basis: not-applicable # follows from question 1: the user of the app is the controller
    source: {kind: code, ref: "src/engine.rs"}

  - id: dictated-text
    component: app
    subjects: ["utilisateurs de l'app", "personnes dont l'utilisateur parle"]
    fields:
      - {name: "texte transcrit de la dictée (texte libre)", category: unknown}
      - {name: "heure et durée de la dictée", category: usage}
    purpose: coller le texte dicté dans l'app active et afficher les dernières dictées dans la fenêtre
    legal_basis: not-applicable # follows from question 1: the user of the app is the controller
    source: {kind: code, ref: "src/engine.rs"}

  - id: claude-questions
    component: app
    subjects: ["utilisateurs de l'app", "personnes dont l'utilisateur parle"]
    fields:
      - {name: "question orale à Claude Code (texte libre)", category: unknown}
      - {name: "chemin du dossier du dépôt (contient le nom du compte macOS)", category: identity}
      - {name: "réponse de Claude Code et identifiant de session", category: usage}
    purpose: répondre avec Claude Code, en lecture seule, à une question orale sur l'un des dépôts de la personne
    legal_basis: not-applicable # follows from question 1: the user of the app is the controller
    source: {kind: code, ref: "src/claude.rs, src/engine.rs"}
    linked_files: ["src/claude.rs"]

  - id: site-connection
    component: site
    subjects: [visiteurs du site de présentation]
    fields:
      - {name: "adresse IP et en-têtes techniques reçus par l'hébergeur", category: connection}
    purpose: servir le site de présentation
    legal_basis: legitimate-interests # declared: processing site-visits, compliance-records PR #9
    source: {kind: code, ref: "site/vite.config.ts"}

  - id: update-connection
    component: updates
    subjects: ["utilisateurs de l'app"]
    fields:
      - {name: "adresse IP et en-têtes techniques du Mac reçus par GitHub", category: connection}
    purpose: vérifier qu'une nouvelle version existe et la télécharger
    legal_basis: legitimate-interests # declared: processing app-updates, compliance-records PR #9
    source: {kind: code, ref: "src/update.rs"}
    linked_files: ["src/update.rs"]

  - id: signing-certificate
    component: app
    subjects: ["utilisateurs de l'app"]
    fields:
      - {name: "certificat de signature Apple de l'utilisateur (nomme son titulaire)", category: identity}
      - {name: "empreinte de l'identité de signature utilisée", category: identity}
    purpose: signer une copie stable de l'app pour que macOS garde ses autorisations micro et accessibilité, et écarter un certificat révoqué
    legal_basis: not-applicable # follows from question 1: the user of the app is the controller
    source: {kind: code, ref: "src/mac.rs"}

storage:
  - id: last-recording
    component: app
    kind: file
    location: ~/Library/Application Support/VoixFluide/derniere-dictee.wav sur le Mac de l'utilisateur
    data: [voice-recording]
    retention: {duration: none, trigger: "remplacé par l'enregistrement suivant ; sinon gardé jusqu'à ce que la personne le supprime"}
    source: {kind: code, ref: "src/engine.rs"}

  - id: in-app-memory
    component: app
    kind: memory
    location: mémoire de l'app sur le Mac de l'utilisateur (historique des 50 dernières dictées, mini-sessions)
    data: [dictated-text, claude-questions]
    retention: {duration: session, trigger: "à la fermeture de l'app"}
    source: {kind: code, ref: "src/engine.rs"}

  - id: clipboard
    component: app
    kind: other
    location: presse-papiers macOS du Mac de l'utilisateur, utilisé pour le collage
    data: [dictated-text]
    retention: {duration: none, trigger: "le texte précédent du presse-papiers est remis après le collage, sauf si « garder le presse-papiers » est activé ; alors jusqu'à la copie suivante"}
    source: {kind: code, ref: "src/mac.rs"}

  - id: settings-file
    component: app
    kind: file
    location: ~/Library/Application Support/VoixFluide/settings.json sur le Mac de l'utilisateur
    data: [claude-questions]
    retention: {duration: none, trigger: "jusqu'à ce que la personne le supprime"}
    source: {kind: code, ref: "src/engine.rs"}

  - id: session-scripts
    component: app
    kind: file
    location: ~/Library/Application Support/VoixFluide/sessions/, un script par mini-session poursuivie dans Terminal, sur le Mac de l'utilisateur
    data: [claude-questions]
    retention: {duration: none, trigger: "jusqu'à ce que la personne le supprime"}
    source: {kind: code, ref: "src/claude.rs"}

  - id: signing-identity
    component: app
    kind: file
    location: ~/Library/Application Support/VoixFluide/programme/identity.txt sur le Mac de l'utilisateur (cert.pem seulement pendant la vérification d'un certificat, puis supprimé)
    data: [signing-certificate]
    retention: {duration: none, trigger: "jusqu'à ce que la personne le supprime"}
    source: {kind: code, ref: "src/mac.rs"}

processors:
  - id: github-pages
    component: site
    name: GitHub
    service: hébergement du site de présentation (GitHub Pages) ; voit l'adresse IP et les en-têtes techniques de chaque visiteur
    country: US # declared: question 4, developer and product owner (looked up in GitHub's privacy statement)
    dpa: "no" # declared: question 5, developer and product owner ("nothing signed yet")
    transfer_outside_eu: true # follows from the country declared in question 4
    safeguard: EU-U.S. Data Privacy Framework (auto-certification de GitHub) et clauses contractuelles types, selon la déclaration de confidentialité de GitHub # declared: question 4
    data: [site-connection]
    source: {kind: code, ref: "site/vite.config.ts"}

  - id: github-releases
    component: updates
    name: GitHub
    service: hébergement des versions que l'app vérifie et télécharge (GitHub Releases) ; voit l'adresse IP de chaque Mac qui vérifie
    country: US # declared: question 4
    dpa: "no" # declared: question 5 ("nothing signed yet")
    transfer_outside_eu: true
    safeguard: EU-U.S. Data Privacy Framework (auto-certification de GitHub) et clauses contractuelles types, selon la déclaration de confidentialité de GitHub # declared: question 4
    data: [update-connection]
    source: {kind: code, ref: "src/update.rs"}

outbound_flows:
  - id: ask-claude-code
    component: app
    to: {name: "Anthropic (via le Claude Code de l'utilisateur)", country: US} # declared: question 4; EEA users contract with Anthropic Ireland, Limited, data processed in the US under standard contractual clauses (Anthropic privacy policy)
    data: [claude-questions]
    purpose: envoyer à Claude la question orale, et les fichiers du dépôt que Claude Code lit, pour obtenir une réponse
    account: user # confirmed: question 5, developer and product owner
    source: {kind: code, ref: "src/claude.rs"}

  - id: update-check
    component: updates
    to: {name: GitHub, country: US} # declared: question 4
    processor: github-releases
    data: [update-connection]
    purpose: vérification des mises à jour et téléchargement de la nouvelle version ; n'envoie que l'adresse IP et les en-têtes techniques
    account: none
    source: {kind: code, ref: "src/update.rs"}

  - id: model-download
    component: app
    to: {name: Hugging Face, country: US} # declared: question 4; Hugging Face's privacy policy names no transfer mechanism
    data: []
    purpose: téléchargement des fichiers du modèle de transcription ; n'envoie que l'adresse IP et les en-têtes techniques
    account: none
    source: {kind: code, ref: "src/whisper.rs"}

  - id: certificate-check
    component: app
    to: {name: "Apple (service OCSP de statut des certificats)", country: US} # declared: question 4; EEA users' data is controlled by Apple Distribution International (IE), transfers under standard contractual clauses (Apple privacy policy)
    data: [signing-certificate]
    purpose: demander à Apple si le certificat de signature de l'utilisateur est révoqué ; la requête nomme le certificat
    account: none
    source: {kind: code, ref: "src/mac.rs"}

  - id: site-hosting
    component: site
    to: {name: GitHub, country: US} # declared: question 4
    processor: github-pages
    data: [site-connection]
    purpose: servir le site de présentation ; l'hébergeur ne voit que l'adresse IP et les en-têtes techniques du visiteur (ni traceur, ni police externe)
    account: organisation # confirmed: question 5, developer and product owner
    source: {kind: code, ref: "site/vite.config.ts, site/index.html"}

notices:
  - id: site-notice
    component: site
    kind: none # no privacy page on the site yet
    ref: site/index.html
    source: {kind: code, ref: "site/index.html, site/src/i18n.ts"}
  - id: app-notice
    component: app
    kind: none # no information screen in the app yet
    ref: first launch
    source: {kind: code, ref: "src/main.rs"}

automated_decisions: []

ai_features:
  - id: dictation-transcription
    component: app
    description: Un modèle de transcription (Whisper sur candle, ou Parakeet sur ONNX Runtime) tourne sur le Mac et transforme la voix de la personne en texte, collé dans l'app active.
    generates_content: true
    interacts_with_persons: false
    human_review: false # found: the text is pasted with no step in between
    role: to-assess # C2-POLY ships an open speech-to-text model inside its app: provider, to confirm
    risk: {level: to-assess, reason: "Transcription pour la dictée, en local ; aucun usage de l'annexe III trouvé. Probablement limité, à confirmer."}
    obligations:
      - {id: art4-ai-literacy, status: open}
      - {id: art50-synthetic-content, status: open, ref: "L'aide à la dictée peut relever de l'exception d'aide à la rédaction ; à évaluer"}
    marking: la fenêtre et la pastille flottante affichent « Transcription… » et le modèle utilisé (page « Modèle et langue ») # declared: question 6, developer and product owner
    data: [voice-recording, dictated-text]
    source: {kind: code, ref: "src/whisper.rs, src/engine.rs"}

  - id: claude-mini-sessions
    component: app
    description: Claude Code répond avec des outils en lecture seule à une question orale sur l'un des dépôts de la personne. La réponse s'affiche dans la fenêtre et son résumé en une phrase est lu à voix haute.
    generates_content: true
    interacts_with_persons: true
    human_review: true # inferred: nothing is applied, Claude Code only reads files and the person reads the answer; to confirm
    role: to-assess # the app calls Claude Code with the person's own account: deployer, or none, to confirm
    risk: {level: to-assess, reason: "Réponses sur le propre dépôt de la personne, en lecture seule ; aucun usage de l'annexe III trouvé. Probablement limité, à confirmer."}
    obligations:
      - {id: art4-ai-literacy, status: open}
      - {id: art50-interaction, status: done, ref: "La page et le raccourci sont libellés Claude Code"}
      - {id: art50-synthetic-content, status: open}
    marking: la page et le raccourci sont libellés « Claude Code » # found in src/main.rs
    data: [claude-questions]
    source: {kind: code, ref: "src/claude.rs, src/main.rs"}

linked_files:
  - "src/**"
  - "site/vite.config.ts"
  - "site/index.html"
  - "site/src/index.css"
