[package]
name = "voix-fluide"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
cpal = "0.15"
candle-core = { version = "=0.9.2", features = ["metal"] }
candle-nn = { version = "=0.9.2", features = ["metal"] }
candle-transformers = { version = "=0.9.2", features = ["metal"] }
candle-metal-kernels = "=0.9.2"
parakeet-rs = "=0.2.7"
ort = "=2.0.0-rc.10"
libc = "0.2"
serde_json = "1"
ureq = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
tray-icon = { version = "0.24", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
