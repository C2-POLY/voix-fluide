name: Release

# A pushed or moved v* tag builds Voix Fluide.app, its .dmg and the bare binary,
# and publishes them in that tag's Release. A pull request touching this build,
# or a manual run, only keeps the files as an artifact of the run.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'build.rs', 'scripts/**', 'assets/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled: this installs the version pinned in rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install || rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # build.rs embeds GITHUB_SHA as the commit and VF_RELEASE=1. bundle.sh builds
      # the release binary, then Voix Fluide.app and Voix-Fluide.dmg (dmgbuild).
      - name: Build the app and the dmg
        run: scripts/bundle.sh
        env:
          VF_RELEASE: '1'

      # The bare binary stays published, with its sha256, so apps installed before
      # the .dmg (0.3.0, a binary alone) still update; dmg_sha256 is for the .app.
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/voix-fluide dist/voix-fluide-aarch64-apple-darwin
          cp target/release-bundle/Voix-Fluide.dmg dist/Voix-Fluide.dmg
          sha=$(shasum -a 256 dist/voix-fluide-aarch64-apple-darwin | cut -d' ' -f1)
          dmg_sha=$(shasum -a 256 dist/Voix-Fluide.dmg | cut -d' ' -f1)
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "voix-fluide") | .version')
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" --arg sha256 "$sha" --arg dmg_sha256 "$dmg_sha" \
            '{version: $version, commit: $commit, sha256: $sha256, dmg_sha256: $dmg_sha256}' > dist/latest.json
          cat dist/latest.json

      # Smoke check: the binary and the app's binary run and know they are release builds.
      - name: Check --version
        run: |
          for bin in dist/voix-fluide-aarch64-apple-darwin "target/release-bundle/Voix Fluide.app/Contents/MacOS/voix-fluide"; do
            line=$("$bin" --version)
            echo "$line"
            case "$line" in *", release)") ;; *) echo "not a release build: $bin"; exit 1 ;; esac
          done
          codesign --verify --deep --strict "target/release-bundle/Voix Fluide.app"

      - uses: actions/upload-artifact@v4
        with:
          name: voix-fluide-${{ github.sha }}
          path: dist/

      # On a tag: create its Release, or replace the files of the existing one
      # (a tag moved with -f keeps its Release).
      - name: Publish Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          { cat scripts/release-install.md; printf '\nCommit %s\n' "$GITHUB_SHA"; } > "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
